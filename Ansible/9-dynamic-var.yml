- name: Dynamic vars
  hosts: local
  connection: local
  vars_prompt:
  - name: Username
    prompt: Please enter your user name
    #entered value will be visible
    private: false 
  - name: Password
    prompt: Please enter your password
    #entered value will not be visible
    private: true 
  tasks:
  - name: Priniting the entered values
    debug:
     msg: "Hi {{ Username }} your password is {{ Password }}"
  