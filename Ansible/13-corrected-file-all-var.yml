---
- name: All type vars will be checked
  hosts: all
  gather_facts: false

  vars:
    name: Sriram
    age: 37
    place: Gollavilli

  vars_files:
    - var_file.yml
    - var2_file.yml

  vars_prompt:
    - name: user_name
      prompt: "Enter your name"
      private: false

    - name: user_age
      prompt: "Enter your age"
      private: false

    - name: username
      prompt: "Enter username"
      private: false

    - name: password
      prompt: "Enter password"
      private: true

  tasks:

    - name: Printing play level values
      debug:
        msg: "Hi... myself {{ name }}, I am from {{ place }}"

    - name: Printing task level values
      vars:
        name: Task_Sriram
        place: Hyderabad
      debug:
        msg: "Hi... myself {{ name }}, I am from {{ place }}"

    - name: Printing values from first vars file
      debug:
        msg: "Hi... myself {{ var_file.name }}, I am from {{ var_file.place }}"

    - name: Printing values from second vars file
      debug:
        msg: "Hi... myself {{ var2_file.name }}, I am from {{ var2_file.place }}"

    - name: Printing dynamically entered values
      debug:
        msg: "Hi {{ user_name }} and your age is {{ user_age }}"

    - name: Display username and password
      debug:
        msg: "Hi {{ username }}, here is your password: {{ password }}"