- name: user creation in client server
  hosts: local
  connection: local
  tasks:
   - name: group creation
     ansible.builtin.group:
      name: ansible
      state: present
   - name: user creation
     ansible.builtin.user:
      name: ansible
      state: present
      shell: /bin/bash
      create_home: yes
      group: ansible 
   - name: user check
     ansible.builten.getent:
      database: passwd
      key: ansible
      #ignore_errors: yes

      